<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arjun Sanesh — Developer, Embedded Systems &amp; Software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12141C"/>
      <stop offset="100%" stop-color="#1B1D29"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9D6FFF" stop-opacity="0"/>
      <stop offset="12%" stop-color="#9D6FFF" stop-opacity="0.9"/>
      <stop offset="88%" stop-color="#9D6FFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9D6FFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- faint data grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.035">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- name -->
  <text x="60" y="98" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="46" font-weight="700" letter-spacing="2" fill="#F5F5F7">ARJUN SANESH</text>

  <!-- subtitle -->
  <text x="61" y="132" font-family="'JetBrains Mono','Roboto Mono',monospace" font-size="15" letter-spacing="0.5" fill="#8B90A3">developer · embedded systems · software</text>

  <!-- telemetry trace, signature element -->
  <path id="trace" d="M60,192 C160,152 220,232 320,192 C420,152 480,212 580,177 C680,142 760,207 860,182 C960,157 1020,202 1140,172"
        fill="none" stroke="url(#lineFade)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" from="0,1400" to="1400,0" dur="2.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </path>

  <!-- moving marker, like a live telemetry readout -->
  <circle r="4.5" fill="#F5F5F7" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" begin="2.2s"
      path="M60,192 C160,152 220,232 320,192 C420,152 480,212 580,177 C680,142 760,207 860,182 C960,157 1020,202 1140,172"/>
  </circle>

  <!-- fastest-lap tag, small nod to the trace's dual meaning -->
  <text x="1140" y="150" text-anchor="end" font-family="'JetBrains Mono','Roboto Mono',monospace" font-size="12" letter-spacing="1.5" fill="#9D6FFF" opacity="0.85">FASTEST LAP</text>
</svg>
